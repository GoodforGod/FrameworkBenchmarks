plugins {
    id "java"
    alias(libs.plugins.quarkus)
    alias(libs.plugins.jte)
}

version = libs.versions.quarkus.get()

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    implementation(platform(libs.quarkusBom))

    implementation(libs.quarkusArc)
    implementation(libs.quarkusRestJackson)
    implementation(libs.quarkusJdbcPostgresql)
    implementation(libs.postgresql)
    implementation(libs.quarkusScheduler)
    implementation(libs.jooq)
    implementation(libs.jteRuntime)
    implementation(variantOf(libs.nettyTransportNativeEpoll) { classifier("linux-x86_64") })

    testRuntimeOnly(libs.logbackClassic)
    testImplementation(libs.testcontainersTestcontainers)
    testImplementation(libs.testcontainersPostgresql)
    testImplementation(libs.testcontainersJunitJupiter)
    testImplementation(libs.junitJupiter)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jte {
    generate()
    binaryStaticContent = true
    contentType = gg.jte.ContentType.Html
}

tasks.generateJte {
    sourceDirectory = layout.projectDirectory.dir("src/main/jte").asFile.toPath()
    targetDirectory = layout.buildDirectory.dir("generated/jte").get().asFile.toPath()
    contentType = gg.jte.ContentType.Html
}

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir("generated/jte"))
    }
}

compileJava.dependsOn(tasks.named("generateJte"))

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(tasks.named("quarkusBuild"))
}
