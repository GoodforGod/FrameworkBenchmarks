plugins {
    id "java"
    id "application"
    id "io.micronaut.application" version "5.0.2"
    id "io.micronaut.aot" version "5.0.2"
    id "gg.jte.gradle" version "3.2.3"
}

version = micronautVersion

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

micronaut {
    version("$micronautVersion")
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        module(project.name)
        group(project.group)
        annotations("io.techempower.benchmark.*")
    }
}

dependencies {
    annotationProcessor "io.micronaut:micronaut-inject-java"
    annotationProcessor "io.micronaut.serde:micronaut-serde-processor"
    annotationProcessor "io.micronaut.data:micronaut-data-processor"

    runtimeOnly "ch.qos.logback:logback-classic:1.5.18"
    runtimeOnly "org.yaml:snakeyaml"

    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut.data:micronaut-data-r2dbc"
    implementation "io.micronaut.r2dbc:micronaut-r2dbc-core"
    implementation "io.micronaut.reactor:micronaut-reactor"
    implementation "io.micronaut.serde:micronaut-serde-jackson"
    implementation "io.micronaut:micronaut-inject"
    implementation "io.micronaut:micronaut-runtime"

    implementation "org.postgresql:r2dbc-postgresql"
    implementation "gg.jte:jte-runtime:3.2.3"

    testImplementation "org.testcontainers:testcontainers:1.21.4"
    testImplementation "org.testcontainers:postgresql:1.21.4"
    testImplementation "org.testcontainers:junit-jupiter:1.21.4"
    testImplementation "org.postgresql:postgresql:42.7.11"
}

jte {
    generate()
    binaryStaticContent = true
    contentType = gg.jte.ContentType.Html
}

tasks.generateJte {
    sourceDirectory = layout.projectDirectory.dir("src/main/jte").asFile.toPath()
    targetDirectory = layout.buildDirectory.dir("generated/jte").get().asFile.toPath()
    contentType = gg.jte.ContentType.Html
}

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir("generated/jte"))
    }
}

compileJava.dependsOn tasks.generateJte

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(tasks.named("distTar"))
}

application {
    applicationName = "application"
    mainClass.set("io.techempower.benchmark.micronaut.Application")
    applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8"]
}

tasks.named("distTar") {
    archiveFileName = "application.tar"
}
