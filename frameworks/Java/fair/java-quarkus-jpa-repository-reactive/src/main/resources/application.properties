# Quarkus configuration for TechEmpower benchmarks
quarkus.http.port=8080

# Virtual Threads (enabled via env variable)
quarkus.virtual-threads.enabled=${VIRTUAL_THREADS_ENABLED:false}

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASS:postgres}
quarkus.datasource.reactive.url=${POSTGRES_REACTIVE_URL:postgresql://localhost:5432/postgres}
quarkus.datasource.reactive.max-size=512

# Hibernate ORM configuration
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation=none

# Disable logging for performance
quarkus.log.level=ERROR
quarkus.log.console.enable=false
quarkus.log.file.enable=false
