server:
  host: 0.0.0.0
  port: 8080
  virtual-threads:
    enabled: ${VIRTUAL_THREADS_ENABLED:true}
  backlog: 8192
  write-queue-length: 8192
  smart-async-writes: true
  connection-options:
    read-timeout: PT0S
    connect-timeout: PT0S
    tcp-no-delay: true
  protocols:
    "http_1_1":
      validate-request-headers: false
      validate-response-headers: false
      validate-path: false
      recv-log: false
      send-log: false

host: "localhost"
db: "postgres"
username: postgres
password: postgres
db-repository: "hikari"
