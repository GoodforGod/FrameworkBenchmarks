plugins {
    alias(libs.plugins.kotlinJvmLegacy)
    alias(libs.plugins.kspLegacy)
    id "application"
    alias(libs.plugins.jte)
}

version = libs.versions.kora1.get()

configurations {
    koraBom
    ksp.extendsFrom(koraBom)
    compileOnly.extendsFrom(koraBom)
    implementation.extendsFrom(koraBom)
    testImplementation.extendsFrom(koraBom)
    kspTest.extendsFrom(koraBom)
}

dependencies {
    koraBom(platform(libs.kora1KoraParent))
    ksp(libs.kora1SymbolProcessors)

    runtimeOnly(libs.slf4jNop)

    implementation(libs.kora1DatabaseVertx)
    implementation(libs.kora1ConfigHocon)
    implementation(libs.kora1JsonModule)
    implementation(libs.kora1HttpServerUndertow)
    implementation(libs.undertowCore)
    implementation(libs.jbossThreads)
    implementation(libs.xnioNio)
    implementation(libs.vertxLegacyPgClient)
    implementation(libs.scramClient)
    implementation(libs.kotlinxCoroutinesJdk8Legacy)
    implementation(libs.jte)

    testRuntimeOnly(libs.logbackClassic)
    testImplementation(libs.testcontainersTestcontainers)
    testImplementation(libs.testcontainersPostgresql)
    testImplementation(libs.testcontainersJunitJupiter)
    testImplementation(libs.postgresql)
    testImplementation(libs.junitJupiter)
}

kotlin {
    jvmToolchain(21)
    sourceSets.main.kotlin.srcDir("build/generated/ksp/main/kotlin")
    sourceSets.test.kotlin.srcDir("build/generated/ksp/test/kotlin")
}

ksp {
    useKsp2 = false
}

jte {
    generate()
    binaryStaticContent = true
    contentType = gg.jte.ContentType.Html
}

tasks.generateJte {
    sourceDirectory = layout.projectDirectory.dir("src/main/jte").asFile.toPath()
    targetDirectory = layout.buildDirectory.dir("generated/jte").get().asFile.toPath()
    contentType = gg.jte.ContentType.Html
}

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir("generated/jte"))
    }
}

compileKotlin.dependsOn tasks.generateJte

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "21"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(tasks.named("distTar"))
}

application {
    applicationName = "application"
    mainClass.set("io.techempower.benchmark.kora.ApplicationKt")
    applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8", "-Djava.locale.providers=SPI,CLDR"]
}

tasks.named("run") {
    environment([
            "POSTGRES_VERTX_URI": "postgresql://$postgresHost:$postgresPort/$postgresDatabase",
            "POSTGRES_USER"     : "$postgresUser",
            "POSTGRES_PASS"     : "$postgresPassword",
    ])
}

tasks.named("distTar") {
    archiveFileName = "application.tar"
}
