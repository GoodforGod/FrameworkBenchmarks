group = 'io.fairframework'
version = libs.versions.benchmark.get()

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://central.sonatype.com/repository/maven-snapshots" }
    }
}

subprojects {
    apply plugin: "java"

    def postgresEnvironment = providers.provider {
        [
                "POSTGRES_JDBC_URL"    : "jdbc:postgresql://$postgresHost:$postgresPort/$postgresDatabase".toString(),
                "POSTGRES_R2DBC_URL"   : "r2dbc:postgresql://$postgresHost:$postgresPort/$postgresDatabase".toString(),
                "POSTGRES_REACTIVE_URL": "postgresql://$postgresHost:$postgresPort/$postgresDatabase".toString(),
                "POSTGRES_USER"        : "$postgresUser".toString(),
                "POSTGRES_PASS"        : "$postgresPassword".toString(),
        ]
    }

    tasks.withType(JavaExec).configureEach {
        environment(postgresEnvironment.get())
    }

    plugins.withId("io.quarkus") {
        tasks.matching { it.name == "quarkusDev" }.configureEach {
            environmentVariables.putAll(postgresEnvironment)
        }
        tasks.matching { it.name == "quarkusRun" }.configureEach {
            jvmArguments.addAll(providers.provider {
                postgresEnvironment.get().collect { key, value -> "-D$key=$value".toString() }
            })
        }
    }

    dependencies {
        testImplementation(platform(libs.junitBom))
        testRuntimeOnly(platform(libs.junitBom))
        testImplementation(libs.junitJupiter)
        testRuntimeOnly(libs.junitPlatformLauncher)
    }

    test {
        jvmArgs += [
                "-XX:+TieredCompilation",
                "-XX:TieredStopAtLevel=1",
        ]

        useJUnitPlatform()
        testLogging {
            showStandardStreams = false
            events("failed")
            exceptionFormat = "full"
        }

        exclude("**/\$*")

        reports {
            html.required = false
            junitXml.required = false
        }
    }
}

tasks.register("resolveFairDependencies") {
    description = "Resolves dependency configurations for Docker builder cache warmup."
    group = "build setup"

    doLast {
        def failures = []
        allprojects.each { project ->
            project.configurations.matching { it.canBeResolved }.each { configuration ->
                try {
                    configuration.resolve()
                } catch (Exception e) {
                    failures += "${project.path}:${configuration.name} - ${e.message}"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Failed to resolve dependency configurations:\n" + failures.join("\n"))
        }
    }
}
