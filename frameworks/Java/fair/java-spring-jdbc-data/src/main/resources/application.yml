spring:
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 512
      minimum-idle: 16
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jdbc:
    template:
      max-rows: 500
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}

server:
  port: 8080
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true
