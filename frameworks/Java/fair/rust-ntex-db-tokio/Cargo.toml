[package]
name = "fair-ntex-db"
version = "0.1.0"
edition = "2021"

[features]
default = []
tokio = ["ntex/tokio"]

[dependencies]
ntex = "3.12.3"
mimalloc = { version = "0.1.52", default-features = false }
nanorand = { version = "0.8.0", default-features = false, features = ["std", "wyrand", "tls"] }
atoi = "3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7.18"
v_htmlescape = "0.17.0"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "thin"
debug = false
incremental = false
overflow-checks = false
