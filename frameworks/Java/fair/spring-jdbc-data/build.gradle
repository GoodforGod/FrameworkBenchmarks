plugins {
    id "java"
    id "org.springframework.boot" version "4.1.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "gg.jte.gradle" version "3.2.3"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    runtimeOnly "org.postgresql:postgresql"

    implementation "org.springframework.boot:spring-boot-starter-data-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-undertow"
    implementation("org.springframework.boot:spring-boot-starter-web") {
        exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat"
    }

    implementation "gg.jte:jte:3.2.3"
    implementation "org.postgresql:postgresql:42.7.11"
    implementation "org.slf4j:slf4j-nop:2.0.17"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

//noinspection GroovyAssignabilityCheck
bootRun {
    environment "POSTGRES_JDBC_URL", "jdbc:postgresql://localhost:5432/postgres"
    environment "POSTGRES_USER", "postgres"
    environment "POSTGRES_PASS", "postgres"
    environment "JET_CUSTOM", "true"
}

jte {
    generate()
    binaryStaticContent = true
    contentType = gg.jte.ContentType.Html
}

tasks.generateJte {
    sourceDirectory = java.nio.file.Paths.get(projectDir.absolutePath, "src", "main", "jte")
    targetDirectory = java.nio.file.Paths.get(projectDir.absolutePath, "build", "generated", "jte")
    sourceSets.main.java.srcDirs += "build/generated/jte"
    contentType = gg.jte.ContentType.Html
}

compileJava.dependsOn tasks.generateJte


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs += "-parameters"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("bootJar") {
    archiveFileName = "${project.name}.jar"
}
