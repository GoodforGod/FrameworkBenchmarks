# Quarkus configuration for TechEmpower benchmarks
quarkus.http.port=8080
# Virtual Threads (enabled via env variable)
quarkus.virtual-threads.enabled=${VIRTUAL_THREADS_ENABLED:true}
# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASS:postgres}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.jdbc.max-size=512
quarkus.datasource.jdbc.min-size=16
quarkus.datasource.jdbc.additional-jdbc-properties."preparedStatementCacheQueries"=512
quarkus.datasource.jdbc.additional-jdbc-properties."preparedStatementCacheSizeMiB"=16
quarkus.datasource.jdbc.additional-jdbc-properties."prepareThreshold"=1
quarkus.datasource.jdbc.additional-jdbc-properties."loggerLevel"=OFF
quarkus.datasource.jdbc.additional-jdbc-properties."sslmode"=disable
quarkus.datasource.jdbc.additional-jdbc-properties."disableColumnSanitiser"=true
# Hibernate ORM configuration
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.second-level-caching-enabled=false
quarkus.hibernate-orm.unsupported-properties."hibernate.cache.use_query_cache"=false
quarkus.hibernate-orm.unsupported-properties."jakarta.persistence.sharedCache.mode"=NONE
quarkus.log.category."org.hibernate.engine.internal.StatisticalLoggingSessionEventListener".level=OFF
# Disable logging for performance
quarkus.log.level=OFF
